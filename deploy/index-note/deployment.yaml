apiVersion: apps/v1
kind: Deployment
metadata:
  name: index-note
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: index-note
  template:
    metadata:
      labels:
        app.kubernetes.io/name: index-note
    spec:
      terminationGracePeriodSeconds: 180
      containers:
        - name: index-note
          image: ghcr.io/chrisns/index-cf-note-queue:1.9.1 # Renovate bumps this; bumped by hand here to close the ring second-factor bypass (an audio part with no filename= skipped the check entirely) ahead of Renovate's own schedule
          env:
            - name: INDEX_BEARER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: index-note
                  key: INDEX_BEARER_TOKENS
            # Second factor. Identifies the ring hardware, so it is a secret and
            # never appears in this repo. See SPEC.md section 6.2.1.
            - name: INDEX_RING_PREFIXES
              valueFrom:
                secretKeyRef:
                  name: index-note
                  key: INDEX_RING_PREFIXES
            - name: VAULT_DIR
              value: /vault
            - name: TZ
              value: Europe/London
            - name: LISTEN_ADDR
              value: ":8080"
            # VOICE.md section 8: fire-and-forget poke after a note is
            # durable. Same namespace, so the short Service name resolves.
            - name: VOICE_SCORER_URL
              value: "http://index-note-voice/score"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
          - mountPath: /vault
            name: vault
      volumes:
      - name: vault
        persistentVolumeClaim:
          claimName: index-note
