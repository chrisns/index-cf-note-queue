[project]
name = "index-note-voice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
# ponytail: kept separate from default deps so a bare "uv sync" stays fast and
# never pulls torch/speechbrain -- only "uv sync --extra ml" (used by the
# Dockerfile) installs these. embed.py imports torch/speechbrain lazily
# inside load_embedder() so unit tests never need this extra.
ml = [
    # Pinned to torchaudio's own major/minor. torchaudio's compiled extension
    # links against torch's ABI, and torchaudio stops at 2.11, so an unpinned
    # torch resolves to 2.13 and _torchaudio.abi3.so fails to load at import.
    # The CUDA wheels tolerated that gap by accident; the +cpu wheels do not.
    "torch>=2.13.0,<2.14",
    # Declared explicitly only so [tool.uv.sources] can pin its index. It is a
    # speechbrain dependency, and speechbrain imports it at module scope, so it
    # must come from the same wheel index as torch. Left on PyPI it is built
    # against the CUDA torch and _torchaudio.abi3.so fails to load against the
    # +cpu build, which crashes the service on import.
    "torchaudio>=2.11,<2.12",
    "speechbrain",
]

# CPU-only torch. The default PyPI wheel bundles the CUDA runtime and pulls the
# nvidia-* packages with it, which is roughly 23GB on disk once extracted. No
# node in this cluster has a GPU, so none of that is reachable code. It is also
# not free: pulling the CUDA image pushed node k3s past its ephemeral-storage
# threshold and the kubelet evicted this pod and obsidian with it.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/index_note_voice"]
