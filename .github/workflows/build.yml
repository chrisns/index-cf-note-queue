name: Docker build
on:
  push:
    paths-ignore: ["voice/**"]

# This repository defaults GITHUB_TOKEN to read-only. A called workflow cannot
# exceed its caller, and dockerbuild.yml needs packages: write to push and
# id-token: write to sign, so the caller must grant both explicitly.
permissions:
  packages: write
  id-token: write

jobs:
  build:
    uses: chrisns/.github/.github/workflows/dockerbuild.yml@4ce70e8f993c40195a754bad5a0bcc2c70bc2dae # main
    with:
      platforms: linux/amd64,linux/arm64
