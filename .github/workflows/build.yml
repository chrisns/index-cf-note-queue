name: Docker build
on:
  push:
    paths-ignore: ["voice/**"]

# This repository defaults GITHUB_TOKEN to read-only. A called workflow cannot
# exceed its caller, and dockerbuild.yml needs packages: write to push and
# id-token: write to sign, so the caller must grant both explicitly.
permissions:
  packages: write
  id-token: write

jobs:
  build:
    uses: chrisns/.github/.github/workflows/dockerbuild.yml@f68271fda70fd23c0b1668cd1daf16f912d18a6e # main
    with:
      platforms: linux/amd64,linux/arm64
