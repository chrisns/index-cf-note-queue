name: Docker build
on:
  push:
    paths-ignore: ["voice/**"]

# This repository defaults GITHUB_TOKEN to read-only. A called workflow cannot
# exceed its caller, and dockerbuild.yml needs packages: write to push and
# id-token: write to sign, so the caller must grant both explicitly.
permissions:
  packages: write
  id-token: write

jobs:
  build:
    uses: chrisns/.github/.github/workflows/dockerbuild.yml@11437276359a6f048d6f5b3bca04ff358948af02 # main
    with:
      platforms: linux/amd64,linux/arm64
