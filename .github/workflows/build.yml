name: Docker build
on:
  push:
    paths-ignore: ["voice/**"]

# This repository defaults GITHUB_TOKEN to read-only. A called workflow cannot
# exceed its caller, and dockerbuild.yml needs packages: write to push and
# id-token: write to sign, so the caller must grant both explicitly.
permissions:
  packages: write
  id-token: write

jobs:
  build:
    uses: chrisns/.github/.github/workflows/dockerbuild.yml@5cfe2573a2f71c22ed365a51351d19c4c92e6151 # main
    with:
      platforms: linux/amd64,linux/arm64
