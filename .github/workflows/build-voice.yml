name: Docker build (voice)

# Separate from build.yml: the shared chrisns/.github dockerbuild.yml hardcodes
# context "." and image ghcr.io/${{ github.repository }}, so it cannot build a
# second image from the voice/ subdirectory. Direct build-push-action steps
# instead, scoped to voice/ only.
on:
  push:
    paths:
      - "voice/**"
      - ".github/workflows/build-voice.yml"

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/chrisns/index-note-voice
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./voice
          # amd64-only: every node in the target k3s cluster (k3s, lenroid,
          # think) is amd64, confirmed with `kubectl get nodes`. Widen to
          # match build.yml's platforms if an arm64 node is ever added.
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ponytail: no image signing yet, add a sign job mirroring build.yml's
      # if this image is ever deployed the same way.
